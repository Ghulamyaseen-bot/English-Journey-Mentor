name: Build English Journey APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find project
        run: |
          PACKAGE=$(find extracted -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_ROOT"

      - name: Install dependencies
        run: |
          cd "$PROJECT_ROOT"
          pnpm install --frozen-lockfile

      - name: Find English Journey app
        run: |
          APP_PACKAGE=$(find extracted -type f -path "*/artifacts/english-journey/package.json" | head -n 1)

          if [ -z "$APP_PACKAGE" ]; then
            echo "ERROR: English Journey app not found."
            find extracted -type f -name package.json
            exit 1
          fi

          APP_DIR=$(dirname "$APP_PACKAGE")

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "English Journey app: $APP_DIR"

      - name: Generate Android project
        run: |
          cd "$APP_DIR"
          pnpm exec expo prebuild --platform android --non-interactive

      - name: Build Release APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Journey-APK
          path: extracted/**/artifacts/english-journey/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
