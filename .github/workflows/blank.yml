name: Build English Journey APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          ZIP=$(find . -type f -name "*.zip" | head -1)
          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Find project
        run: |
          P=$(find project -name package.json -not -path "*/node_modules/*" | head -1)
          echo "ROOT=$(dirname "$P")" >> "$GITHUB_ENV"

      - name: Install
        run: cd "$ROOT" && pnpm install --frozen-lockfile

      - name: Find app
        run: |
          A=$(find project -path "*/artifacts/english-journey/package.json" | head -1)
          echo "APP=$(dirname "$A")" >> "$GITHUB_ENV"

      - name: Create Android
        run: cd "$APP" && CI=1 pnpm exec expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd "$APP/android"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Journey-APK
          path: project/**/artifacts/english-journey/android/app/build/outputs/apk/release/*.apk
